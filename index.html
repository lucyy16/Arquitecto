<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Arquitecto</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f4f4e8;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: #fcfbf7;
            border: 1px solid #dcdcd0;
            padding: 30px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 25px;
        }

        .profile-area {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex: 1;
        }

        .profile-pic {
            width: 110px;
            height: 120px;
            object-fit: cover;
            border: 1px solid #a8a898;
            background-color: #c0c0b0;
            flex-shrink: 0;
        }

        .header-text {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quote {
            font-style: italic;
            font-size: 1em;
            color: #4a4a40;
            line-height: 1.3;
        }

        .author {
            font-size: 0.9em;
            color: #555;
        }

        .icons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .icon-box {
            border: 1px solid #ccc;
            padding: 6px 12px;
            background: #fff;
            font-size: 0.95em;
            display: inline-block;
        }

        .landscape-card {
            width: 280px;
            background: #fff;
            padding: 8px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .landscape-pic {
            width: 100%;
            height: auto;
            display: block;
        }

        .secondary-quote {
            margin: 25px 0 30px 0;
            font-style: italic;
            color: #4a4a40;
            line-height: 1.4;
            max-width: 600px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border: 1px solid #ccc;
            background-color: #eee;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Sección Superior: Perfil + Paisaje -->
        <div class="top-section">
            
            <div class="profile-area">
                <!-- Foto de perfil -->
                <img src="./perfil.jpeg" alt="Foto de perfil" class="profile-pic">

                <div class="header-text">
                    <p class="quote">"Encomienda a Jehova tus obras, Y tus pensamientos serán afirmados"</p>
                    <p class="author">Proverbios 16: 3</p>

                    <div class="icons">
                        <span class="icon-box">p 🌸</span>
                        <span class="icon-box">♧</span>
                    </div>
                </div>
            </div>

            <!-- Foto de paisaje -->
            <div class="landscape-card">
                <img src="./paisaje.webp" alt="Paisaje" class="landscape-pic">
            </div>

        </div>

        <!-- Cita Secundaria -->
        <div class="secondary-quote">
            <p>"Todo tiene su tiempo, y todo lo que se quiere debajo del cielo tiene su hora".</p>
            <p><strong>Eclesiastes:3-1</strong></p>
        </div>

        <!-- Galería de 4 Imágenes -->
        <div class="gallery">
            <img src="./foto1.jpeg" alt="Fotografía 1">
            <img src="./foto2.jpeg" alt="Fotografía 2">
            <img src="./foto3.jpeg" alt="Fotografía 3">
            <img src="./foto4.jpeg" alt="Fotografía 4">
        </div>

    </div>

</body>
</html>
